{% extends "base.html" %}

{% block title %}Page Not Found - Photo Indexer{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center">
        <i data-lucide="search-x" class="w-24 h-24 text-gray-400 mx-auto mb-6"></i>
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">404</h1>
        <p class="text-xl text-gray-500 dark:text-gray-400 mb-8">Page not found</p>
        <a href="/" class="btn btn-primary">
            <i data-lucide="home" class="w-5 h-5 mr-2"></i>
            Go Home
        </a>
    </div>
</div>

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });
</script>
{% endblock %}

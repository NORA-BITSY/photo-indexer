[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-indexer"
version = "0.1.0"
description = "Self-hosted, local-first photo indexing CLI with VLM enrichment, taxonomies, and NER"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "httpx>=0.24",
]
authors = [{ name = "pat" }]
keywords = ["photo", "indexing", "vlm", "ollama", "cli", "ner", "taxonomy", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
photo-indexer = "photo_indexer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["photo_indexer*"]

[tool.setuptools]
packages = ["photo_indexer"]
